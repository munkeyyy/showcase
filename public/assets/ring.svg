<svg xmlns="http://www.w3.org/2000/svg" width="66" height="66" viewBox="0 0 66 66"><defs>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.06" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.35" xChannelSelector="R" yChannelSelector="G" result="disp"/>
    <feDropShadow dx="1.8" dy="2.6" stdDeviation="2.4" flood-color="#584f40" flood-opacity="0.26"/>
  </filter>
  <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="3" seed="3" result="n"/>
    <feBlend in="SourceGraphic" in2="n" mode="multiply"/>
  </filter>
</defs>
<g filter="url(#rough)"><circle cx="33" cy="33" r="18" fill="none" stroke="#aaa89f" stroke-width="7"/><circle cx="33" cy="33" r="10" fill="none" stroke="#dfdacd" stroke-width="3"/></g></svg>